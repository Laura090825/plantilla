<!-- ============================================
     HERO COMPONENT - Reutilizable para todas las páginas
     ============================================ 
     
     USO:
     1. Incluir en cualquier página HTML
     2. Agregar el atributo data-hero-bg con el nombre de la imagen
     3. Las imágenes deben estar en assets/img/
     
     Ejemplo:
     <div id="hero-container" data-hero-bg="principal.jpg" 
          data-hero-title="Tu Título" 
          data-hero-subtitle="Tu Subtítulo"
          data-hero-badge="Tu Badge"></div>
     ============================================ -->

<!-- Script para personalizar el Hero -->
<script>
  // Configuración de fondos para cada página
  const heroBackgrounds = {
    "index.html": "principal.jpg",
    "quienes-somos.html": "quienes-somos.jpg",
    "mision-vision.html": "mision-vision.jpg",
    "estructura.html": "estructura.jpg",
    "informes.html": "informes.jpg",
    "barrido-limpieza.html": "barrido.jpg",
    "recoleccion-transporte.html": "recoleccion.jpg",
    "jornadas.html": "jornadas.jpg",
    "contacto.html": "contacto.jpg",
    "pqr.html": "pqr.jpg",
    default: "principal.jpg",
  };

  // Obtener el nombre de la página actual
  function getCurrentPage() {
    const path = window.location.pathname;
    const page = path.split("/").pop() || "index.html";
    return page;
  }

  // Aplicar fondo según la página
  function applyHeroBackground() {
    const currentPage = getCurrentPage();
    const hero = document.querySelector(".hero-modern");

    if (hero) {
      // Obtener imagen configurada o usar default
      const bgImage =
        heroBackgrounds[currentPage] || heroBackgrounds["default"];

      // Verificar si hay un data-hero-bg personalizado
      const customBg = hero.getAttribute("data-hero-bg");
      const finalBg = customBg || bgImage;

      // Aplicar el fondo
      hero.style.backgroundImage = `
        linear-gradient(135deg, rgba(255, 112, 67, 0.4), rgba(230, 74, 25, 0.4)),
        url('../assets/img/${finalBg}')
      `;

      // Para rutas relativas desde la raíz
      if (
        currentPage === "index.html" ||
        window.location.pathname.endsWith("/")
      ) {
        hero.style.backgroundImage = `
          linear-gradient(135deg, rgba(255, 112, 67, 0.4), rgba(230, 74, 25, 0.4)),
          url('./assets/img/${finalBg}')
        `;
      }
    }
  }

  // Personalizar textos del hero si hay atributos data-*
  function customizeHeroContent() {
    const hero = document.querySelector(".hero-modern");

    if (hero) {
      // Badge
      const badge = hero.getAttribute("data-hero-badge");
      if (badge) {
        const badgeText = document.getElementById("hero-badge-text");
        if (badgeText) badgeText.textContent = badge;
      }

      // Título destacado
      const title = hero.getAttribute("data-hero-title");
      if (title) {
        const titleHighlight = document.getElementById("hero-title-highlight");
        if (titleHighlight) titleHighlight.textContent = title;
      }

      // Subtítulo
      const subtitle = hero.getAttribute("data-hero-subtitle");
      if (subtitle) {
        const subtitleText = document.getElementById("hero-subtitle-text");
        if (subtitleText) subtitleText.textContent = subtitle;
      }
    }
  }

  // Ejecutar al cargar la página
  document.addEventListener("DOMContentLoaded", () => {
    applyHeroBackground();
    customizeHeroContent();
  });
</script>
